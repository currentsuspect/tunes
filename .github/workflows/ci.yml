name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tunesd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tunesd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tunesd/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app

      - name: Analyze
        run: flutter analyze --fatal-infos
        working-directory: app

      - name: Unit tests
        run: flutter test
        working-directory: app

      - name: Debug APK builds
        working-directory: app
        run: |
          flutter build apk --debug \
            --dart-define=GIT_COMMIT=${{ github.sha }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=CHANNEL=dev

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tunes-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30