name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tunesd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tunesd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tunesd/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  app:
    runs-on: ubuntu-latest
    # Needed to publish the release below. Scoped to this job rather than the
    # workflow so the other jobs keep the read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gh release --notes reads the commit subject, which needs the commit
          # itself; the default shallow fetch has it, but not its message on
          # every provider path. One extra commit is cheap insurance.
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app

      - name: Analyze
        run: flutter analyze --fatal-infos
        working-directory: app

      - name: Unit tests
        run: flutter test
        working-directory: app

      # Release, not debug. A debug APK runs Dart in the JIT with a service
      # isolate attached and every assert live; on a mid-range phone that is
      # the difference between a 15-second cold start and a normal one. It is
      # also the build that gets sideloaded and judged, so it has to be the
      # one CI produces. Signed with the committed debug keystore (see
      # android/app/build.gradle.kts), so it installs over previous builds.
      # The build number is the run number plus 1000. Local release builds made
      # on 2026-10-05 were numbered 913-917, above the run number at the time
      # (337); the app only offers an update when the release number is higher
      # than its own, so without the offset those phones would never be offered
      # one. Releases are tagged with the same number, so tunesd's integer
      # comparison still holds.
      # --build-number is the Android versionCode. Every build used to carry
      # versionCode 1 (pubspec 0.1.0+1), so an update installed from inside the
      # app was the same version as the one it replaced, and on a test phone the
      # system installer said "App installed" while the package stayed put. It
      # now rises with the build number, so every update is a real upgrade.
      - name: Release APK builds
        working-directory: app
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=TUNESD_URL=https://tunes.aestra.studio \
            --dart-define=GIT_COMMIT=${{ github.sha }} \
            --dart-define=BUILD_NUMBER=$((${{ github.run_number }} + 1000)) \
            --build-number=$((${{ github.run_number }} + 1000)) \
            --dart-define=CHANNEL=dev

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tunes-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          # Overwritten every run, so the quota holds one APK, not one per
          # push: at ~47 MB each with 30-day retention this filled the
          # account quota and red-flagged every PR until it was pruned by
          # hand. deploy.sh deletes the artifact after a successful install,
          # so even that one is short-lived.
          overwrite: true
          retention-days: 7

      # A release as well as an artifact, because they are for different
      # readers. The artifact is for a human with a GitHub account: it expires
      # in 30 days and needs auth to fetch. The release is what tunesd polls so
      # phones can be told an update exists — it does not expire, and
      # /releases/latest is a stable shape to read.
      #
      # Only on main, and only for a real push: a pull request producing
      # releases would announce unmerged work to every device.
      #
      # The tag is the run number, which is what the app carries as
      # BUILD_NUMBER, so "is there something newer" is an integer comparison
      # and not a version-string parse.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: app
        run: |
          set -euo pipefail
          build=$((${{ github.run_number }} + 1000))
          gh release create "build-${build}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Build ${build}" \
            --notes "$(git log -1 --pretty=%s ${{ github.sha }})

          Commit: ${{ github.sha }}"

  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app

      # Release bundle for the box. No install flow: the daemon serves the
      # phone APK via /update/apk, and shipping a Linux tarball there is a
      # product decision, not a CI default — artifact only.
      - name: Release Linux bundle builds
        working-directory: app
        run: |
          flutter build linux --release \
            --dart-define=TUNESD_URL=http://192.168.100.6:4780 \
            --dart-define=GIT_COMMIT=${{ github.sha }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=CHANNEL=dev

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: tunes-linux
          path: app/build/linux/x64/release/bundle
          retention-days: 30