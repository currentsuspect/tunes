org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep resource names in the release build.
#
# audio_service resolves the media notification's small icon at runtime with
# getIdentifier("ic_stat_music", "drawable", pkg). Release builds collapse the
# names of resources nothing references statically, so the lookup returned 0,
# Android rejected the notification as having no valid small icon, and the app
# crashed the moment playback started. Verified against resources.arsc: the
# name was present for ic_launcher (referenced from the manifest) and absent
# for ic_stat_music.
android.enableResourceOptimizations=false
